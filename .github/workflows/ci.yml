name: CI

on:
    pull_request:
    push:
        branches: [main]
jobs:
    test:
        runs-on: ubuntu-lastest
        services:
            postgres:
                image: postgres-17
                env:
                    POSTGRES_USER: tracker
                    POSTGRES_PASSWORD: tracker
                    POSTGRES_DB: tracker_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U tracker"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL:
                postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
            TEST_DATABASE_URL:
                postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: "3.13"
                cache: pip
            - run: pip install -r requirements-dev.txt
            - name: Migrations apply to an empty database
              run: alembic upgrade head
            - name: Tests
              run: pytest -v
