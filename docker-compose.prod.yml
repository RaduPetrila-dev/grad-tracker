services:
  app:
    build: .
    env_file: .env
    ports:
      - "80:8000"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      # Bound to localhost only: reach the UI through an SSH tunnel, never the open internet.
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  promdata:
