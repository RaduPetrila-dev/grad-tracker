services:
  db:
    image: postgres:17
    environment:
       POSTGRES_USER: tracker
       POSTGRES_PASSWORD: tracker
       POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@db:5432/tracker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

volumes:
  pgdata:


